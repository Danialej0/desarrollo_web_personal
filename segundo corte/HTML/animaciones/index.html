<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mi Universo de Personajes</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <h1>Mis Personajes Favoritos</h1>

        <p>
            Una galería creada con HTML y CSS.
        </p>

    </header>


    <main>
        <section class="galeria">
            <h2>Mi personaje</h2>

            <article class="card card-flash">
                <div class="card-imagen">
                    <span class="etiqueta">VELOCIDAD</span>
                </div>

                <div class="card-contenido">
                    <span class="categoria">HEROE</span>
                    <h3>Flash</h3>
                    <p>Un personaje capaz de moverse a velocidades extraordinarias.</p>

                    <div class="poder">
                        <span class="poder-icono">⚡</span>
                        <div>
                            <strong>Poder especial</strong>
                            <small>Velocidad extrema</small>
                        </div>
                    </div>

                    <button type="button">Activar poder</button>
                </div>
            </article>
        </section>

    </main>


    <footer class="titulo">

        HTML5 + CSS3

    </footer>

</body>

</html>
