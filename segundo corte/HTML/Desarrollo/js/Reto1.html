<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-image: url("../imagenes/azul.webp");
        }
    </style>
</head>
<body>

    <h1>Contact form</h1>
    <form name="formulario" action="" method="post" autocomplete="off" target="_blank">

    <label for="Nombre ">Your Name: </label>  
    <input type="text" id="Nombre" name ="nombre" required placeholder="First name">
    <input type="text" id="apellido" name ="nombre" required placeholder="Last name"> <br><br>

    <label for="correo ">Your email: </label>  
    <input type="email" id="correo" name ="correo" required placeholder="e.g hello@contact.net"><br><br>

    <label for="telfono">Phone number*: </label>  
    <input type="tel" id="telefono" name ="telefono" required placeholder="#####">
    <input type="tel" id="telefono2" name ="telefono" required placeholder="#####">
    <input type="tel" id="telefono3" name ="telefono" required placeholder="#####"><br><br>

    <label for="mensaje ">Message subject*: </label>  
    <select id="mensaje" name="mensaje">
        <option value="0">Other       </option>
    </select><br><br>

    <label for="Message">message*: </label>  
    <textarea id="message" name="message" required></textarea><br><br>

    <div id="contenedor" width="300" height="300">
        <label for="captcha">Verification*: </label>
        <img src="../imagenes/captcha.png" alt="Código de verificación" width="180">
        <br><br>
    </div>
    


    <input type="submit" value="Submit Form">





    </form>

</body>
</html>
